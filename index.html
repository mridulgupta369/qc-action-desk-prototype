<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>QC Action Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one working column (max 960px). Summary first, then a ranked to-do list; detail opens in place. */
:root {
  --bg: #f2f5f5; --surface: #ffffff; --surface-2: #eaf0f0; --ink: #0f1b1c; --ink-2: #3f5253; --muted: #667a7b;
  --line: #d6e0e0; --accent: #0b6b6f; --accent-ink: #ffffff; --accent-wash: #dff0ef;
  --t1: #2a78d6; --t2: #eb6834; --t3: #1baf7a; --t4: #eda100;
  --warn: #fab219; --warn-ink: #7a4d00; --scrim: rgba(15, 27, 28, .45);
  --q-critical: #d03b3b; --q-avail: #ec835a; --q-demand: #fab219; --q-scale: #0ca30c;
  --neg: #b42318; --pos: #006300;
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1415; --surface: #151d1e; --surface-2: #1c2627; --ink: #edf3f3; --ink-2: #b6c5c6; --muted: #8b9d9e;
    --line: #2a3738; --accent: #4fc0ba; --accent-ink: #062321; --accent-wash: #15302f;
    --t1: #3987e5; --t2: #d95926; --t3: #199e70; --t4: #c98500;
    --warn: #fab219; --warn-ink: #fab219; --scrim: rgba(0, 0, 0, .6); --neg: #f97066; --pos: #3ccb3c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1415; --surface: #151d1e; --surface-2: #1c2627; --ink: #edf3f3; --ink-2: #b6c5c6; --muted: #8b9d9e;
  --line: #2a3738; --accent: #4fc0ba; --accent-ink: #062321; --accent-wash: #15302f;
  --t1: #3987e5; --t2: #d95926; --t3: #199e70; --t4: #c98500;
  --warn: #fab219; --warn-ink: #fab219; --scrim: rgba(0, 0, 0, .6); --neg: #f97066; --pos: #3ccb3c; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); padding-inline: 16px; }
.bar-in { max-width: 1120px; margin: 0 auto; padding-block: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.brand { font-weight: 600; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand-mark { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; }
.brand-mark svg { width: 14px; height: 14px; stroke: var(--accent-ink); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.pill { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
.role-pick { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); min-width: 0; }
.role-pick select { max-width: 100%; min-width: 0; padding: 6px 30px 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 14px; }

main { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 22px 96px; }
.loading { color: var(--muted); padding-block: 40px; }

/* heading block */
.head { display: grid; gap: 14px; margin-bottom: 18px; }
.back { justify-self: start; border: 0; background: none; padding: 0; color: var(--accent); font-size: 14px; font-weight: 500; cursor: pointer; }
.role { margin: 0; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
h1 { margin: 2px 0 0; font-size: 26px; line-height: 1.2; font-weight: 600; letter-spacing: -.015em; text-wrap: balance; }
.summary { display: flex; flex-wrap: wrap; gap: 10px 32px; }
.summary div { display: grid; }
.summary b { font-size: 24px; font-weight: 600; line-height: 1.2; }
.summary span { font-size: 13px; color: var(--muted); }
.checked { margin: 0; font-size: 13px; color: var(--muted); max-width: 72ch; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-right: auto; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.search input { width: 220px; max-width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 14px; }
.toolbar > .search:first-child { margin-right: auto; }

h2.sec { font-size: 15px; font-weight: 600; margin: 26px 0 10px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
h2.sec span { font-weight: 400; font-size: 13px; color: var(--muted); }

/* cards */
.cards { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.card-top { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 6px 14px; align-items: start; }
.rank { font: 500 13px/1.9 var(--mono); color: var(--muted); }
.card-body { min-width: 0; display: grid; gap: 6px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; line-height: 1.6; padding: 0 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.tag i { width: 8px; height: 8px; border-radius: 50%; background: var(--t1); }
.tag.t2 i { background: var(--t2); } .tag.t3 i { background: var(--t3); } .tag.t4 i { background: var(--t4); }
.tag.plain-muted { border-color: transparent; color: var(--muted); padding: 0 2px; }
.tag.new { background: var(--accent-wash); border-color: transparent; color: var(--accent); font-weight: 500; }
.tag.stale { border-color: transparent; color: var(--warn-ink); font-weight: 500; padding: 0 2px; }
.tag.stale svg { width: 13px; height: 13px; }
.tag.stale svg path { fill: var(--warn); }
.tag.stale svg path.ex { fill: none; stroke: #2b1d00; stroke-width: 1.6; stroke-linecap: round; }
.card h3 { margin: 0; font-size: 16px; line-height: 1.35; font-weight: 600; text-wrap: balance; }
.why { margin: 0; color: var(--ink-2); font-size: 14px; }
.ask { margin: 0; font-size: 14px; }
.ask span { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin-right: 4px; }
.money { text-align: right; display: grid; justify-items: end; }
.money b { font-size: 20px; font-weight: 600; line-height: 1.3; white-space: nowrap; }
.money span { font-size: 12px; color: var(--muted); white-space: nowrap; }
.card-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0 40px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 12px; font-size: 13px; font-weight: 500; cursor: pointer; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); }

/* details */
.detail { margin: 14px 0 0 40px; padding-top: 14px; border-top: 1px solid var(--line); display: grid; gap: 12px; min-width: 0; }
.sparks { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 12px 20px; }
.spark { margin: 0; min-width: 0; }
.spark figcaption { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.spark svg { width: 100%; max-width: 300px; height: auto; display: block; overflow: visible; }
.sp-band { fill: var(--surface-2); }
.sp-base { stroke: var(--line); stroke-width: 1; }
.sp-area { fill: var(--accent); opacity: .1; }
.sp-hist, .sp-cur { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.sp-hist { stroke: var(--muted); }
.sp-cur { stroke: var(--accent); }
.sp-dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.sp-end { fill: var(--ink); font: 600 12px var(--font); }
.sp-tick { fill: var(--muted); font: 10px var(--font); }
.sp-hit { fill: transparent; }
.how, .meta-line { margin: 0; font-size: 13px; color: var(--ink-2); max-width: 80ch; }
.meta-line { color: var(--muted); font-family: var(--mono); font-size: 12px; }
.tbl-wrap { overflow-x: auto; min-width: 0; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 500; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
.n { text-align: right; font-variant-numeric: tabular-nums; }
table.team { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; border-collapse: separate; border-spacing: 0; overflow: hidden; font-size: 14px; }
table.team th, table.team td { padding-inline: 14px; }
table.team tbody tr { cursor: pointer; }
table.team tbody tr:hover, table.team tbody tr:focus-visible { background: var(--surface-2); }
table.team tbody tr:last-child td { border-bottom: 0; }
.go { color: var(--accent); font-weight: 500; text-align: right; }
.late { color: var(--warn-ink); font-weight: 600; }

/* one section per lever: availability, discoverability, conversion */
.lever-sec { display: grid; gap: 8px; margin-bottom: 18px; }
h3.lever { margin: 6px 0 0; font-size: 15px; font-weight: 600; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
h3.lever .dot { align-self: center; width: 10px; height: 10px; }
h3.lever span:not(.dot) { font-weight: 400; font-size: 13px; color: var(--muted); }
/* inside a lever, one short list per action type */
.grp-sec { display: grid; gap: 6px; }
.grp-sec + .grp-sec { margin-top: 6px; }
h4.grp { margin: 2px 0 0; font-size: 13px; font-weight: 600; color: var(--ink-2); display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
h4.grp span { font-weight: 400; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* numbers that aren't in the data */
.na-v { display: inline-block; font-size: 12px; line-height: 1.5; color: var(--muted); border: 1px dashed var(--line); border-radius: 999px; padding: 0 8px; white-space: nowrap; }
.m.na dt { color: var(--muted); }
.na-box { height: 64px; display: grid; place-items: center; border: 1px dashed var(--line); border-radius: 8px; max-width: 300px; }
.na-note { grid-column: 1 / -1; margin: 2px 0 0; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.empty { padding: 28px 16px; text-align: center; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }

/* explore */
.jump { color: var(--accent); font-weight: 500; text-decoration: none; white-space: nowrap; }
.jump:hover { text-decoration: underline; }
.explore { margin-top: 44px; padding-top: 6px; border-top: 1px solid var(--line); display: grid; gap: 14px; scroll-margin-top: 72px; }
.explore h2.sec { margin-bottom: 0; }
/* the two quadrant lines, set above the quadrants */
.cuts { display: flex; flex-wrap: wrap; align-items: end; gap: 8px 16px; }
.cuts .hint { flex: 1 1 220px; align-self: center; }
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.f { display: grid; gap: 3px; font-size: 12px; color: var(--muted); min-width: 0; }
.f select, .f input { padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 14px; color: var(--ink); min-width: 130px; max-width: 100%; }
.f-q input { width: 190px; }
.quads { display: grid; grid-template-columns: 20px minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: ". tl tr" "st demand scale" "sb critical availability"; gap: 6px 8px; }
.ax { font-size: 12px; color: var(--muted); }
.ax-tl { grid-area: tl; } .ax-tr { grid-area: tr; } .ax-st { grid-area: st; } .ax-sb { grid-area: sb; }
.ax-st, .ax-sb { writing-mode: vertical-rl; transform: rotate(180deg); align-self: center; justify-self: center; white-space: nowrap; }
.q-demand { grid-area: demand; } .q-scale { grid-area: scale; } .q-critical { grid-area: critical; } .q-availability { grid-area: availability; }
.quad { text-align: left; display: grid; align-content: start; gap: 3px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; min-width: 0; }
.quad:hover { background: var(--surface-2); }
.quad[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.q-head { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
.q-head svg, .qchip svg, .crumb-q svg { width: 16px; height: 16px; flex: none; }
.q-stats { display: flex; flex-wrap: wrap; gap: 2px 18px; font-size: 13px; color: var(--ink-2); align-items: baseline; }
.q-stats b { font-size: 22px; font-weight: 600; color: var(--ink); margin-right: 3px; }
.q-money { font-size: 13px; color: var(--ink-2); }
.q-rule { font-size: 12px; color: var(--muted); }
.neg, .dl.neg { color: var(--neg); } .pos, .dl.pos { color: var(--pos); }
.drillbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 14px; min-width: 0; }
.crumb { border: 0; background: none; padding: 2px 4px; border-radius: 6px; color: var(--accent); font-weight: 500; cursor: pointer; }
.crumb[aria-current="true"] { color: var(--ink); font-weight: 600; }
.sep { color: var(--muted); }
.crumb-q { display: inline-flex; align-items: center; gap: 6px; }
.hint { margin: 0; font-size: 13px; color: var(--muted); }
.more-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px; }
.count-note { margin: 0; font-size: 12px; color: var(--muted); text-align: center; }
.x { border: 0; background: none; cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 6px; color: var(--muted); border-radius: 999px; }
.seg { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.seg-l { font-size: 12px; color: var(--muted); margin-right: 2px; }
table.grid { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; border-collapse: separate; border-spacing: 0; overflow: hidden; }
table.grid th, table.grid td { padding-inline: 12px; }
table.grid th:first-child, table.grid td:first-child { padding-left: 14px; }
.sort { border: 0; background: none; padding: 0; font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; }
th[aria-sort] .sort { color: var(--ink); }
table.grid tbody tr.row { cursor: pointer; }
table.grid tbody tr.row:hover, table.grid tbody tr.row:focus-visible { background: var(--surface-2); }
.name { font-weight: 500; }
.go-i { color: var(--accent); }
.sub { color: var(--muted); font-size: 12px; }
.mix { display: flex; gap: 2px; width: 92px; height: 8px; }
.mix span { height: 100%; border-radius: 2px; min-width: 3px; }
.m-critical { background: var(--q-critical); } .m-availability { background: var(--q-avail); } .m-demand { background: var(--q-demand); } .m-scale { background: var(--q-scale); }
.qchip { display: inline-flex; align-items: center; gap: 6px; }
td.act { color: var(--ink-2); }
.leaf-row td { background: var(--surface-2); white-space: normal; }
.leaf { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 6px 0 10px; max-width: 860px; }
.facts { margin: 0; font-size: 13px; color: var(--ink-2); }
.leaf-acts { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 13px; }
.noact { margin: 0; font-size: 13px; color: var(--ink); }
.more { justify-self: center; }

/* filter row */
.filters { padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; }
.summary small { font-size: 14px; font-weight: 500; color: var(--muted); }
.sec-row { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
.sec-row .btn { align-self: center; margin-top: 16px; }

/* one-line action rows */
.arows { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.arow + .arow { border-top: 1px solid var(--line); }
.arow-main { width: 100%; display: grid; grid-template-columns: 22px 10px minmax(0, 1fr) auto auto 14px; align-items: center; gap: 10px; padding: 10px 14px; border: 0; background: none; text-align: left; cursor: pointer; }
.arow-main:hover { background: var(--surface-2); }
.arow.open > .arow-main { background: var(--surface-2); }
.arow-main .rank { font: 500 12px/1 var(--mono); color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--t1); display: inline-block; flex: none; }
.dot.t2 { background: var(--t2); } .dot.t3 { background: var(--t3); } .dot.t4 { background: var(--t4); }
/* the main line is the instruction: wrap a long one onto a second line rather than cut off where to act */
.arow-title { font-weight: 500; font-size: 14px; min-width: 0; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; }
.arow-tags { display: flex; gap: 6px; align-items: center; }
.arow-money { font-weight: 600; font-size: 15px; white-space: nowrap; text-align: right; min-width: 74px; }
.arow-money small { font-size: 11px; font-weight: 400; color: var(--muted); margin-left: 2px; }
.chev { width: 8px; height: 8px; border-right: 1.6px solid var(--muted); border-bottom: 1.6px solid var(--muted); transform: rotate(-45deg); justify-self: center; }
[aria-expanded="true"] .chev, .is-open > .name .chev { transform: rotate(45deg); }
.arow-detail { padding: 4px 14px 16px 56px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; background: var(--surface-2); }
.arow-detail > *, .leaf > *, .detail > * { min-width: 0; }
.kind { margin: 0; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; }

/* explore tree */
.focus { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 14px; }
.focus svg { width: 16px; height: 16px; }
.link-btn { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 500; cursor: pointer; font-size: 13px; }
.link-btn:hover { text-decoration: underline; }
.tree-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.tree .name { padding-left: calc(14px + var(--d, 0) * 22px); white-space: nowrap; }
.tree .name .chev { display: inline-block; margin-right: 10px; vertical-align: 2px; }
.tree tr.grp.d0 > td { font-weight: 500; }
.tree tr.d1 > td, .tree tr.d2 > td { font-size: 13px; }
.tree tr.is-open > td { background: var(--surface-2); }
.tree tr.d1:not(.is-open) > td { background: color-mix(in srgb, var(--surface-2) 45%, var(--surface)); }
.tree tr.d2:not(.is-open) > td { background: color-mix(in srgb, var(--surface-2) 70%, var(--surface)); }
.tree .detail-tr > td { background: var(--surface-2); padding: 4px 14px 14px calc(36px + var(--d, 0) * 22px); white-space: normal; }
.tree .more-tr > td { padding: 6px 14px 8px calc(36px + var(--d, 0) * 22px); }
.leaf-title { margin: 0; font-weight: 600; font-size: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.leaf-acts li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
@media (prefers-reduced-motion: no-preference) {
  .enter, .enter + .detail-tr { animation: enter .18s ease-out; }
  @keyframes enter { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
}

/* metrics panel (the measures HUL tracks) */
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(250px, 100%), 1fr)); gap: 10px 22px; min-width: 0; }
.mhead { grid-column: 1 / -1; margin: 0; font: 500 11px var(--mono); letter-spacing: .04em; color: var(--muted); }
.msec { min-width: 0; }
.msec h4 { margin: 0 0 4px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.msec dl { margin: 0; display: grid; gap: 4px; }
.m { display: grid; gap: 1px; padding: 5px 8px; border-radius: 6px; }
.m dt { font-size: 12px; color: var(--ink-2); }

    avail: ['Supply', 't1', 'A', 'restock'], availGroup: ['Supply', 't1', 'A', 'restock'], po: ['Order (PO)', 't1', 'A', 'po'], list: ['List it', 't1', 'A', 'list'],
    search: ['Search spend', 't2', 'D', 'search'], media: ['Off-platform media', 't2', 'D', 'media'],
    price: ['Price cut', 't3', 'C', 'cut'], priceUp: ['Price rise', 't3', 'C', 'rise']
  };
  // The three levers, in funnel order (Kedar's buckets; the lead chose one section per lever, 2026-10-02).
  var LEVERS = [
    { id: 'A', name: 'Availability', q: 'can shoppers get it?', dot: 't1' },
    { id: 'D', name: 'Discoverability', q: 'can they find it?', dot: 't2' },
    { id: 'C', name: 'Conversion', q: 'will they buy it?', dot: 't3' }
  ];
  // Inside each lever, every action type has its own short list, so a type with bigger ₹ can't hide the others (lead, 2026-10-04).
  var GROUPS = [
    { id: 'po', lever: 'A', name: 'Order (PO)', who: 'the platform orders more' },
    { id: 'restock', lever: 'A', name: 'Supply', who: 'our supply chain delivers what the platform ordered' },
    { id: 'list', lever: 'A', name: 'List it', who: 'the platform adds it to its range' },
    { id: 'search', lever: 'D', name: 'Search spend' }, { id: 'media', lever: 'D', name: 'Off-platform media' },
    { id: 'cut', lever: 'C', name: 'Price cuts' }, { id: 'rise', lever: 'C', name: 'Price rises' }
  ];
  var FIRST = 5;   // rows each action type shows before "See more"
  var ROLES = { KAE: 'KAE', PERF: 'Performance marketing', CSP: 'CSP' };
  function limits() { var l = {}; GROUPS.forEach(function (g) { l[g.id] = FIRST; }); return l; }

  var state = { persona: 'master', stack: [], f: {}, openAct: {}, done: {}, snoozed: {}, actLimit: limits(), justOpened: null, scopeOwner: null };

  // ---------- formatting ----------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }
  function trim0(s) { return s.replace(/\.0(?=\D|$)/, ''); }
  function inr(v) {
    var a = Math.abs(v);
    if (a >= 1e7) return '₹' + trim0((v / 1e7).toFixed(1)) + ' Cr';
    if (a >= 1e5) {
      if (Math.round(a / 1e5) >= 100) return '₹' + trim0((v / 1e7).toFixed(1)) + ' Cr';
      return '₹' + trim0((v / 1e5).toFixed(a >= 1e6 ? 0 : 1)) + 'L';
    }
    if (a >= 1e3) return Math.round(a / 1e3) >= 100 ? '₹' + trim0((v / 1e5).toFixed(1)) + 'L' : '₹' + Math.round(v / 1e3) + 'K';
    return '₹' + Math.round(v);
  }
  function pct(x) { return Math.round(x * 100) + '%'; }
  function pct1(x) { return (Math.round(x * 1000) / 10).toFixed(1) + '%'; }
  function num(x) { return Math.round(x).toLocaleString('en-IN'); }
  function units(x) { return x >= 100 ? num(x) : (Math.round(x * 10) / 10).toLocaleString('en-IN'); }
  function qty(x) { return (x >= 1000 ? Math.round(x / 10) * 10 : Math.max(1, Math.round(x))).toLocaleString('en-IN'); }   // whole units to order or supply
  function days(d) { return d >= 99 ? 'plenty' : (Math.round(d * 10) / 10) + (Math.round(d * 10) / 10 === 1 ? ' day' : ' days'); }
  function sku(a) { return Q.SKU[a.sku]; }
  function catName(id) { return Q.CAT[id].name; }
  function avgOf(list, f) { return list.reduce(function (s, c) { return s + c[f]; }, 0) / list.length; }
  function sumOf(list, f) { return list.reduce(function (s, c) { return s + c[f]; }, 0); }
  function uniq(a) { return a.filter(function (x, i) { return a.indexOf(x) === i; }); }
  function listCities(list, max) {
    var names = uniq(list.map(function (c) { return c.city; }));
    return names.length > max ? names.slice(0, max).join(', ') + ' and ' + (names.length - max) + ' more' : names.join(', ');
  }
  function chg(b, n) { return b > 0 ? n / b - 1 : 0; }
  function sgnPct(v) { var r = Math.round(Math.abs(v) * 100); return r ? (v < 0 ? '−' : '+') + r + '%' : '0%'; }   // never '−0%'
  function sgnPct1(v) { var r = Math.round(Math.abs(v) * 1000) / 10; return (v < 0 && r ? '−' : '+') + r.toFixed(1) + '%'; }
  function pts(v) { return Math.round(Math.abs(v) * 100) + ' pts'; }
  function moved(v) { return Math.abs(v) < 0.0005 ? 'didn’t move' : 'moved ' + sgnPct1(v); }
  function rs(v) { return v < 1e5 ? '₹' + num(v) : inr(v); }   // exact rupees for small amounts such as spends a day
  function roleOf(o) { return o.split('|')[0]; }
  function ownerLabel(o) {
    var p = o.split('|');
    if (p[0] === 'KAE') return 'KAE · ' + p[1] + ' · ' + catName(p[2]);
    if (p[0] === 'KAM') return 'KAM · ' + p[1];
    if (p[0] === 'CSP') return 'CSP · ' + catName(p[1]);
    if (p[0] === 'PERF') return 'Perf. marketing · ' + catName(p[1]);
    return o;
  }

  // ---------- what each action says ----------
  // The title is the instruction: verb + how much + what + where. Cities and reasons follow in the details.
  function cover(x) { return R.coverDays * x; }              // units for 7 days of normal (Apr–Jun) sales
  function poQty(c) { return Math.max(0, cover(c.natDrrB) - c.openOrders); }
  function content(a) {
    var c = a.combos[0], n = a.combos.length, s = a.sku != null ? sku(a) : null;
    function drop() { return 1 - sumOf(a.combos, 'drrNow') / sumOf(a.combos, 'drrBefore'); }
    // OLA across several cities is the average over all their dark stores (lead, 2026-10-05)
    function storesOla(f) { var w = 0, v = 0; a.combos.forEach(function (x) { w += x.stores; v += x[f] * x.stores; }); return pct(v / w); }
    function olaNow() { return storesOla('olaNow'); }
    function olaWas() { return storesOla('olaBefore'); }
    switch (a.type) {
      case 'po':
        return {
          title: 'Get ' + c.plat + ' to order ' + qty(poQty(c)) + ' units of ' + s.name,
          why: c.plat + '’s open orders cover only ' + days(c.cover) + ' of sales. It is short in ' + n + (n > 1 ? ' cities' : ' city') +
            ' (in stock ' + olaNow() + ' of the time, usually ' + olaWas() + ').',
          ask: 'Ask ' + c.plat + ' to raise a PO for ' + qty(poQty(c)) + ' units: ' + R.coverDays + ' days of normal sales (' + units(c.natDrrB) +
            ' a day) minus ' + qty(c.openOrders) + ' already on order. Short cities below.'
        };
      // Supply (lead, 2026-10-05): the platform has ordered, so the shortfall is on our side: our supply chain
      // hasn't delivered against those orders. The platform is not asked to do anything here.
      case 'avail':
        return {
          title: 'Supply ' + qty(cover(c.drrBefore)) + ' units of ' + s.name + ' to ' + c.plat + ' for ' + c.city,
          why: (c.cover != null
            ? c.plat + ' has ordered: its open orders cover ' + days(c.cover) + ' of sales nationally. Our supply against those orders hasn’t arrived, so '
            : c.plat + '’s open orders aren’t in the data. ') +
            c.city + ' is in stock only ' + pct(c.olaNow) + ' of the time, against its usual ' + pct(c.olaBefore) + '.',
          ask: (c.cover != null ? 'Raise with supply chain' : 'Check that ' + c.plat + ' has ordered, then raise with supply chain') + ': send ' +
            qty(cover(c.drrBefore)) + ' units for ' + c.city + ', ' + R.coverDays + ' days of normal sales (' + units(c.drrBefore) + ' a day).'
        };
      case 'availGroup':
        return {
          title: 'Supply ' + qty(cover(sumOf(a.combos, 'drrBefore'))) + ' units of ' + s.name + ' to ' + a.plat + ' across ' + n + ' cities',
          why: (c.cover != null
            ? a.plat + ' has ordered: its open orders cover ' + days(c.cover) + ' of sales nationally. Our supply against those orders hasn’t arrived, so '
            : a.plat + '’s open orders aren’t in the data. ') +
            (c.cover != null ? 'these' : 'These') + ' cities are in stock only ' + olaNow() + ' of the time, against their usual ' + olaWas() + '.',
          ask: (c.cover != null ? 'Raise with supply chain' : 'Check that ' + a.plat + ' has ordered, then raise with supply chain') +
            ': send each city ' + R.coverDays + ' days of its normal sales. Units per city below.'
        };
      case 'list':
        var on = uniq([].concat.apply([], a.combos.map(function (x) { return x.on; })));
        return {
          title: 'Get ' + a.plat + ' to list ' + s.name + (n > 1 ? ' in ' + n + ' cities' : ' in ' + c.city),
          why: 'Listed on every other platform in ' + (n > 1 ? 'these cities' : c.city) + ' (' + on.join(', ') + '), where it sells about ' +
            units(sumOf(a.combos, 'drr')) + ' a day per platform, but not on ' + a.plat + '.',
          ask: 'Ask ' + a.plat + ' to list it' + (n > 1 ? ' in these cities, biggest first (below).' : ' in ' + c.city + '.')
        };
      case 'search':
        var none = c.spendN === 0;   // nothing recorded now: stopped, or moved to a category-level campaign
        return {
          title: 'Add back ' + rs(c.spendB - c.spendN) + ' a day of search spend for ' + s.name + ' on ' + c.plat + ' in ' + c.city,
          why: (none
            ? 'Search spend on this base pack went from ' + rs(c.spendB) + ' a day to 0 / data not available: the campaign may have stopped, or moved to a category-level campaign. Paid sales '
            : 'Search spend fell ' + pct(-chg(c.spendB, c.spendN)) + ' (' + rs(c.spendB) + ' → ' + rs(c.spendN) + ' a day) and paid sales ') +
            (c.paidN === 0 ? 'went to 0 / data not available' : 'fell ' + pct(-chg(c.paidB, c.paidN))) +
            (chg(c.orgB, c.orgN) > -0.05 ? ', while organic held (' + sgnPct(chg(c.orgB, c.orgN)) + ')' : ', and organic moved ' + sgnPct(chg(c.orgB, c.orgN))) +
            '. Stock is at its usual level (' + pct(c.olaNow) + '), so the ads will show.',
          ask: none ? 'Check whether the spend moved to a category-level campaign. If not, take the budget back to ' + rs(c.spendB) + ' a day.'
            : 'Take the budget back to ' + rs(c.spendB) + ' a day.'
        };
      case 'media':
        return {
          title: 'Run off-platform media for ' + a.seg + ' in ' + a.city + ' to win back ' + pts(a.sosB - a.sosN) + ' of search share',
          why: 'Our share of ' + a.seg + ' searches in ' + a.city + ' fell from ' + pct(a.sosB) + ' to ' + pct(a.sosN) +
            ': fewer shoppers are searching for our brands by name.',
          ask: 'Take it to the ' + a.seg + ' brand team: media outside the platforms, in ' + a.city + '.'
        };
      case 'price': case 'priceUp':
        var up = a.type === 'priceUp', verb = up ? 'Raise' : 'Cut', how = up ? ' cheaper' : ' dearer';
        if (a.segLine) {
          var nPacks = uniq(a.combos.map(function (x) { return x.sku; })).length, gap = Math.abs(a.hulMove - a.segMove);
          return {
            title: verb + ' prices of ' + nPacks + ' ' + a.seg + ' base packs on ' + a.plat + ' by about ' + pct(gap),
            why: 'HUL’s average ' + a.seg + ' price on ' + a.plat + ' ' + moved(a.hulMove) + ' while the segment’s average price moved ' + sgnPct1(a.segMove) +
              ', in ' + a.nCities + (a.nCities > 1 ? ' cities' : ' city') + ': we are now ' + pts(gap) + how + '. ' +
              (up ? 'Sales of these base packs are holding' : 'Sales of these base packs are down ' + pct(drop())) + ', with stock at its usual level.',
            ask: 'Take it to the brand team. Suggested price per base pack below; start with the biggest.'
          };
        }
        var cur = avgOf(a.combos, 'skuPN'), sug = Math.round(avgOf(a.combos, 'sug')), by = Math.max(1, Math.round(Math.abs(cur - sug)));
        return {
          title: verb + ' the price of ' + s.name + ' on ' + a.plat + ' by ₹' + num(by) + ' (to ₹' + num(sug) + ')' + (n > 1 ? ' in ' + n + ' cities' : ' in ' + c.city),
          why: 'Our price ' + moved(avgOf(a.combos, 'ourMove')) + ' while the ' + s.seg + ' segment’s average price moved ' + sgnPct1(avgOf(a.combos, 'segMove')) +
            ': we are ' + pts(avgOf(a.combos, 'gap')) + how + '. ' + (up ? 'Sales are holding (DRR ' + sgnPct(-drop()) + ')' : 'DRR is down ' + pct(drop())) +
            ', with stock at its usual level.',
          ask: 'Take it to the brand team: ₹' + num(sug) + ' moves our price in line with the segment.'
        };
    }
  }

  function howValue(a) {
    var c = a.combos[0], s = a.sku != null ? sku(a) : null, n = a.combos.length;
    if (n === 1 && (a.type === 'po' || a.type === 'availGroup')) a = { type: 'avail', combos: a.combos, sku: a.sku, value: a.value };
    switch (a.type) {
      case 'avail':
        var gain = c.rate * (c.olaBefore - c.olaNow);
        return 'Sells about ' + units(c.rate) + ' a day when in stock. Getting OLA from ' + pct(c.olaNow) + ' back to its usual ' + pct(c.olaBefore) +
          ' adds about ' + units(gain) + ' a day × ₹' + Math.round(c.price) + ' × 30 days = ' + inr(a.value) + ' a month.';
      // The values below follow the lead's review of 2026-10-05 (HANDOVER 6.4).
      case 'list':
        return 'For each city: what it sells a day on the other platforms there (their average), scaled to ' + a.plat + '’s size there (HUL’s units a day on ' +
          a.plat + ' against the others), × its price × 30 days. ' + (n > 1 ? 'Summed over the cities: ' : '') + inr(a.value) + ' a month.';
      case 'media':
        return 'Our ' + a.seg + ' sales in ' + a.city + ' (all platforms) are ' + inr(a.sales) + ' a month, and our search share fell by ' + pct((a.sosB - a.sosN) / a.sosB) +
          ' of what it was. Counting half of that, since searches lead sales but not one for one: ' + inr(a.value) + ' a month.';
      case 'search':
        return 'Spend to add back ' + rs(c.spendB - c.spendN) + ' a day × ₹' + c.roas.toFixed(1) + ' of sales per ₹1 on generic keywords for ' + c.seg + ' on ' + c.plat +
          ' (ROAS) × 30 days = ' + inr(a.value) + ' a month.';
      case 'price':
        if (n === 1) return 'Sales recovered: DRR fell from ' + units(c.drrBefore) + ' to ' + units(c.drrNow) + ' a day, so ' + units(c.drrBefore - c.drrNow) + ' × ₹' + Math.round(c.price) + ' (its Apr–Jun price)' +
          ' × 30 days = ' + inr(c.value + c.cutCost) + '. Minus what the cut gives away: ₹' + Math.round(c.skuPN - c.sug) + ' less on today’s ' + units(c.drrNow) +
          ' a day × 30 days = ' + inr(c.cutCost) + '. Net: ' + inr(a.value) + ' a month.';
        return 'For each row: sales recovered, minus what the cut gives away on today’s volume. Summed: ' + inr(a.value) + ' a month.';
      case 'priceUp':
        if (n === 1) return '₹' + Math.round(c.sug - c.skuPN) + ' more a unit × ' + units(c.drrNow) + ' a day × 30 days = ' + inr(a.value) + ' a month, if volume holds.';
        return 'For each row: (suggested − current price) × units a day × 30 days, if volume holds. Summed: ' + inr(a.value) + ' a month.';
    }
    if (n === 1) {
      return 'DRR fell from ' + units(c.drrBefore) + ' to ' + units(c.drrNow) + ' a day. ' + units(c.drrBefore - c.drrNow) + ' × ₹' + Math.round(c.price) + ' × 30 days = ' + inr(a.value) + ' a month.';
    }
    return 'The sum over every row. Each row is worked out the same way as a single city.';
  }

  // ---------- small trend lines ----------
  function spark(vals, fmt, label) {
    var W = 280, H = 76, pl = 8, pr = 56, pt = 12, pb = 20, n = vals.length;
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    var pad = (hi - lo) * 0.2 || hi * 0.1 || 1;
    lo = Math.max(0, lo - pad); hi = hi + pad;
    function x(i) { return pl + (W - pl - pr) * i / (n - 1); }
    function y(v) { return pt + (H - pt - pb) * (1 - (v - lo) / (hi - lo)); }
    var pts = vals.map(function (v, i) { return [x(i), y(v)]; });
    function line(a) { return a.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(''); }
    var base = H - pb, last = pts[n - 1];
    var area = line(pts.slice(3)) + 'L' + last[0].toFixed(1) + ' ' + base + 'L' + pts[3][0].toFixed(1) + ' ' + base + 'Z';
    var desc = Q.MONTHS.map(function (m, i) { return m + ' ' + fmt(vals[i]); }).join(', ');
    var hits = pts.map(function (p, i) {
      return '<rect class="sp-hit" x="' + (p[0] - 12).toFixed(1) + '" y="0" width="24" height="' + H + '"><title>' +
        Q.MONTHS[i] + ': ' + esc(fmt(vals[i])) + '</title></rect>';
    }).join('');
    var ticks = [0, 3, n - 1].map(function (i) {
      return '<text class="sp-tick" x="' + pts[i][0].toFixed(1) + '" y="' + (H - 5) + '" text-anchor="' + (i === 0 ? 'start' : 'middle') + '">' + Q.MONTHS[i] + '</text>';
    }).join('');
    return '<figure class="spark"><figcaption>' + esc(label) + '</figcaption>' +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(label + ': ' + desc) + '">' +
      '<rect class="sp-band" x="' + (pts[3][0] - 6).toFixed(1) + '" y="' + pt + '" width="' + (last[0] - pts[3][0] + 12).toFixed(1) + '" height="' + (base - pt) + '"></rect>' +
      '<line class="sp-base" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + base + '" y2="' + base + '"></line>' +
      '<path class="sp-area" d="' + area + '"></path>' +
      '<path class="sp-hist" d="' + line(pts.slice(0, 4)) + '"></path>' +
      '<path class="sp-cur" d="' + line(pts.slice(3)) + '"></path>' +
      '<circle class="sp-dot" cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="4"></circle>' +
      '<text class="sp-end" x="' + (last[0] + 9).toFixed(1) + '" y="' + (last[1] + 4).toFixed(1) + '">' + esc(fmt(vals[n - 1])) + '</text>' +
      ticks + hits + '</svg></figure>';
  }

  // ---------- the metrics HUL can track, for one combination ----------
  // tone: 'up' = higher is better, 'down' = lower is better, '' = neutral
  function delta(b, n, kind, tone) {
    var d, text;
    if (kind === 'pts') { d = n - b; text = Math.round(Math.abs(d) * 100) ? (d < 0 ? '−' : '+') + Math.abs(Math.round(d * 100)) + ' pts' : '0 pts'; }
    else if (kind === 'pts1') { d = n - b; text = (d < 0 ? '−' : '+') + Math.abs(Math.round(d * 1000) / 10).toFixed(1) + ' pts'; }
    else if (kind === 'pct1') { d = b > 0 ? n / b - 1 : 0; text = sgnPct1(d); }
    else if (kind === 'rank') { d = b - n; text = n === b ? 'no change' : (n > b ? '▼ ' + (n - b) : '▲ ' + (b - n)); }
    else { d = b > 0 ? n / b - 1 : 0; text = b > 0 ? sgnPct(d) : '–'; }
    var flat = kind === 'rank' ? d === 0 : Math.abs(d) < (kind === 'idx' ? 1 : kind === 'pct' ? 0.02 : 0.005);
    var cls = !tone || flat ? 'flat' : (tone === 'up' ? d > 0 : d < 0) ? 'pos' : 'neg';
    return '<span class="dl ' + cls + '">' + text + '</span>';
  }
  // A number that isn't in the data for this base pack, city and platform (lead, 2026-10-04): shown, never guessed.
  var NA = '<span class="na-v" title="Not in the data for this platform and city">Not available</span>';
  // Spends, paid sales and category spend come from feeds where "nothing recorded" looks like zero (lead, 2026-10-05):
  // there may be no spend, the spend may be booked at category or keyword level instead of this base pack, or the data
  // may be missing. So a 0 there is shown as "0 / data not available", never as a plain ₹0.
  var ZERO_NA = '<span class="na-v" title="Zero in the data: no spend, spend booked at category or keyword level instead of this base pack, or no data">0 / data not available</span>';
  var ZERO_NA_KEYS = ['spends', 'paid', 'catspend'];
  function metrics(c, drivers) {
    var d = drivers || [], zeroShown = false;
    function naRow(label) { return '<div class="m na"><dt>' + esc(label) + '</dt><dd>' + NA + '</dd></div>'; }
    function row(key, label, b, n, fmt, kind, tone, note) {
      if (n == null) return naRow(label);
      var drv = d.indexOf(key) >= 0, head = '<div class="m' + (drv ? ' drv' : '') + '"><dt>' + esc(label) + (drv ? ' <span class="drv-tag">likely cause</span>' : '') + '</dt><dd>';
      if (ZERO_NA_KEYS.indexOf(key) >= 0 && (b === 0 || n === 0)) {   // no % change against an unknown zero
        zeroShown = true;
        return head + (b === n ? ZERO_NA : (b === 0 ? ZERO_NA : '<span class="was">' + fmt(b) + '</span>') + '<span class="arr" aria-label="to">→</span>' +
          (n === 0 ? ZERO_NA : '<b>' + fmt(n) + '</b>')) + '</dd></div>';
      }
      return head +
        (b == null ? '' : '<span class="was">' + fmt(b) + '</span><span class="arr" aria-label="to">→</span>') + '<b>' + fmt(n) + '</b>' +
        (b == null ? '' : ' ' + delta(b, n, kind, tone)) + (note ? ' <span class="sub">' + esc(note) + '</span>' : '') + '</dd></div>';
    }
    function sec(title, body) { return '<section class="msec"><h4>' + title + '</h4><dl>' + body + '</dl></section>'; }
    // A proxy's level means nothing on its own, so only its change is shown (lead, 2026-10-05: traffic)
    function changeRow(label, b, n) {
      var ch = chg(b, n);
      return '<div class="m"><dt>' + esc(label) + '</dt><dd><b class="' + (Math.abs(ch) < 0.02 ? '' : ch < 0 ? 'neg' : 'pos') + '">' + sgnPct(ch) + '</b> <span class="sub">vs Apr–Jun</span></dd></div>';
    }
    function perDayU(v) { return units(v) + '/day'; }
    function rupee(v) { return '₹' + Math.round(v); }
    function rupeeDay(v) { return rs(v) + '/day'; }
    function rank(v) { return '#' + v; }
    // Price moves are compared, never price levels: no fixed SPI target per base pack (lead, 2026-10-02).
    function moveRow(key, label, ours, seg) {
      if (ours == null || seg == null) return naRow(label);
      var g = ours - seg, drv = d.indexOf(key) >= 0, big = Math.abs(g) >= R.priceGap;
      return '<div class="m' + (drv ? ' drv' : '') + '"><dt>' + esc(label) + (drv ? ' <span class="drv-tag">likely cause</span>' : '') + '</dt><dd><b>' + sgnPct1(ours) +
        '</b> vs <b>' + sgnPct1(seg) + '</b> <span class="dl ' + (!big ? 'flat' : g > 0 ? 'neg' : 'pos') + '">' + (g < 0 ? '−' : '+') + pts(g) + '</span> <span class="sub">' +
        (!big ? 'in line with the segment' : g > 0 ? 'dearer than the segment' : 'cheaper than the segment') + '</span></dd></div>';
    }
    var bpMove = c.drrNow / c.drrBefore - 1, catMove = c.catDrrN / c.catDrrB - 1, gap = bpMove - catMove;
    var vsCat = '<div class="m' + (d.indexOf('vscat') >= 0 ? ' drv' : '') + '"><dt>This base pack vs its category' +
      (d.indexOf('vscat') >= 0 ? ' <span class="drv-tag">likely cause</span>' : '') + '</dt><dd><b>' + sgnPct(bpMove) + '</b> vs <b>' + sgnPct(catMove) + '</b> ' +
      '<span class="dl ' + (Math.abs(gap) < 0.02 ? 'flat' : gap < 0 ? 'neg' : 'pos') + '">' + (gap < 0 ? '−' : '+') + Math.abs(Math.round(gap * 100)) + ' pts</span>' +
      ' <span class="sub">' + (Math.abs(gap) <= R.withCat ? 'moving with the category' : gap < 0 ? 'falling behind the category' : 'ahead of the category') + '</span></dd></div>';
    return '<div class="mgrid"><p class="mhead">Apr–Jun → Jul–Sep</p>' +
      sec('Availability',
        row('ola', 'OLA (city × base pack)', c.olaBefore, c.olaNow, pct, 'pts', 'up') +
        row('orders', 'Open orders (national, ' + c.plat + ')', null, c.openOrders, function (v) { return num(v) + ' units'; }, '', '', c.cover != null ? '≈ ' + days(c.cover) + ' of sales' : '')) +
      sec('Sales',
        row('drr', 'DRR', c.drrBefore, c.drrNow, perDayU, 'pct', 'up') +
        row('organic', 'Organic sales', c.orgB, c.orgN, perDayU, 'pct', 'up') +
        row('paid', 'Paid sales', c.paidB, c.paidN, perDayU, 'pct', 'up') +
        row('catdrr', 'Category DRR (HUL ' + catName(c.cat) + ', ' + c.city + ', ' + c.plat + ')', c.catDrrB, c.catDrrN, perDayU, 'pct', 'up') +
        vsCat +
        changeRow('Traffic (proxy: all HUL units on ' + c.plat + ' in ' + c.city + ')', c.trafB, c.trafN)) +
      // This base pack nationally (lead, 2026-10-05), to compare the city with: same platform, then all platforms.
      sec('This base pack nationally',
        row('natola', 'OLA on ' + c.plat + ' (all its ' + num(c.natStores) + ' dark stores in ' + num(c.natCities) + ' cities)', c.natOlaB, c.natOlaN, pct, 'pts', 'up') +
        row('natdrr', 'DRR on ' + c.plat + ' (all its cities)', c.natDrrB, c.natDrr, perDayU, 'pct', 'up') +
        row('allola', 'OLA on all platforms (all its ' + num(c.allStores) + ' dark stores)', c.allOlaB, c.allOlaN, pct, 'pts', 'up') +
        row('alldrr', 'DRR on all platforms', c.allDrrB, c.allDrrN, perDayU, 'pct', 'up')) +
      sec('Price',
        row('price', 'Our price', c.skuPB, c.skuPN, rupee, 'pct1', '') +
        row('segprice', c.seg + ' average price (top 25 search results, volume-weighted across keywords)', c.segPB, c.segPN, rupee, 'pct1', '') +
        moveRow('gap', 'Our price move vs the segment’s', c.ourMove, c.segMove) +
        moveRow('hul', 'HUL’s average ' + c.seg + ' price here (all our packs) vs the segment’s', c.hulMove, c.segMove)) +
      sec('Search share and rank',
        row('sos', 'Our share of ' + c.seg + ' searches in ' + c.city + ' (our brands ÷ all brands, Blinkit keyword volumes)', c.sosB, c.sosN, pct1, 'pts1', 'up') +
        row('sot', 'SOT: HUL share of top-25 tiles, ' + c.seg + ' keywords', c.sotB, c.sotN, pct1, 'pts1', 'up') +
        row('sotorg', 'SOT organic', c.sotOB, c.sotON, pct1, 'pts1', 'up') +
        row('sotpaid', 'SOT paid', c.sotPB, c.sotPN, pct1, 'pts1', 'up') +
        row('rank', 'Segment rank', c.rankB, c.rankN, rank, 'rank', 'up')) +
      sec('Spends',
        row('spends', 'Spends on this base pack', c.spendB, c.spendN, rupeeDay, 'pct', '') +
        row('catspend', 'Category spend (' + catName(c.cat) + ', ' + c.city + ', ' + c.plat + ')', c.catSpB, c.catSpN, rupeeDay, 'pct', '') +
        row('roas', 'Generic keyword ROAS (' + c.seg + ', ' + c.plat + ')', null, c.roas, function (v) { return '₹' + v.toFixed(1) + ' of sales per ₹1'; })) +
      (c.missing && c.missing.length ? '<p class="na-note">' + NA + ' means the number isn’t in the data for this platform and city, so checks that need it were skipped.</p>' : '') +
      (zeroShown ? '<p class="na-note">' + ZERO_NA + ' means the data shows zero: no spend, spend booked at category or keyword level instead of this base pack, or no data.</p>' : '') +
      '</div>';
  }
  function trends(c) {
    var catLabel = 'Category spend by month (' + catName(c.cat) + ')';
    return '<div class="sparks">' + spark(c.olaS, pct, 'OLA by month') + spark(c.drrS, function (v) { return units(v) + '/day'; }, 'DRR by month (units)') +
      (c.catSpS ? spark(c.catSpS, function (v) { return inr(v) + '/day'; }, catLabel)
        : '<figure class="spark"><figcaption>' + esc(catLabel) + '</figcaption><div class="na-box">' + NA + '</div></figure>') + '</div>';
  }

  function evidence(a) {
    var c = a.combos[0], out = '', n = a.combos.length, head, rowFn, sorted = a.combos.slice().sort(function (x, y) { return y.value - x.value; });
    function table(h, fn, rows, noun) {
      return '<div class="tbl-wrap"><table><thead><tr>' + h + '</tr></thead><tbody>' +
        rows.slice(0, 12).map(function (x) { return '<tr>' + fn(x) + '</tr>'; }).join('') + '</tbody></table></div>' +
        (rows.length > 12 ? '<p class="count-note left">Showing the 12 biggest of ' + num(rows.length) + ' ' + noun + '.' + (a.type === 'list' ? '' : ' Explore below has every row.') + '</p>' : '');
    }
    if (a.type === 'media') {
      out += '<p class="natline"><b>Our share of ' + esc(a.seg) + ' searches in ' + esc(a.city) + ':</b> ' + pct(a.sosB) + ' → ' + pct(a.sosN) +
        ' (Apr–Jun → Jul–Sep). Searches for our brands ÷ searches for all brands in the segment, from Blinkit keyword volumes, for all of quick commerce.</p>';
    } else if (a.type === 'list') {
      out += table('<th>City</th><th>Listed on</th><th class="n">A day there → here</th><th class="n">₹ a month</th>', function (x) {
        return '<td>' + esc(x.city) + '</td><td>' + esc(x.on.join(', ')) + '</td><td class="n">' + units(x.drr) + ' → ' + units(x.drr * x.scale) + '</td><td class="n">' + inr(x.value) + '</td>';
      }, sorted, 'cities');
    } else if (n === 1 && a.type !== 'po') {
      out += trends(c) + metrics(c, c.drivers);
    } else if (a.segLine) {
      var bySku = {};
      a.combos.forEach(function (x) { (bySku[x.sku] = bySku[x.sku] || []).push(x); });
      var prow = Object.keys(bySku).map(function (k) {
        var l = bySku[k];
        return { name: Q.SKU[+k].name, cities: l.length, cur: avgOf(l, 'skuPN'), sug: avgOf(l, 'sug'), gap: avgOf(l, 'gap'), value: sumOf(l, 'value') };
      }).sort(function (x, y) { return y.value - x.value; });
      out += table('<th>Base pack</th><th class="n">Cities</th><th class="n">Price → suggested</th><th class="n">Gap vs segment</th><th class="n">₹ a month</th>', function (x) {
        return '<td>' + esc(x.name) + '</td><td class="n">' + x.cities + '</td><td class="n">₹' + num(x.cur) + ' → ₹' + num(x.sug) + '</td><td class="n">' +
          (x.gap < 0 ? '−' : '+') + pts(x.gap) + '</td><td class="n">' + inr(x.value) + '</td>';
      }, prow, 'base packs');
    } else if (a.type === 'price' || a.type === 'priceUp') {
      out += table('<th>City</th><th class="n">Our price</th><th class="n">Segment price</th><th class="n c-drr">DRR</th><th class="n">₹ a month</th>', function (x) {
        return '<td>' + esc(x.city) + '</td><td class="n">' + sgnPct1(x.ourMove) + '</td><td class="n">' + sgnPct1(x.segMove) + '</td><td class="n c-drr">' + units(x.drrBefore) + ' → ' + units(x.drrNow) +
          '</td><td class="n">' + inr(x.value) + '</td>';
      }, sorted, 'cities');
    } else {
      var showU = a.type === 'availGroup';
      // An order is split across cities by their normal sales: each city gets a week of its sales minus its share of what's on order.
      var po = a.type === 'po', total = po ? poQty(c) : 0;
      function cityOrder(x) { return total * x.drrBefore / c.natDrrB; }
      if (po) {
        out += '<p class="natline"><b>Order for ' + esc(c.plat) + ':</b> ' + R.coverDays + ' days × ' + units(c.natDrrB) + ' normal daily sales − ' + qty(c.openOrders) +
          ' already on order = <b>' + qty(total) + ' units</b>, split across cities by their normal sales. Short cities:</p>';
      }
      out += table('<th>City</th>' + (showU ? '<th class="n">Units to supply</th>' : po ? '<th class="n">Units to order</th>' : '') +
        '<th class="n">OLA</th><th class="n c-drr">DRR</th><th class="n">₹ a month</th>', function (x) {
        return '<td>' + esc(x.city) + '</td>' + (showU ? '<td class="n"><b>' + qty(cover(x.drrBefore)) + '</b></td>' : po ? '<td class="n"><b>' + qty(cityOrder(x)) + '</b></td>' : '') +
          '<td class="n">' + pct(x.olaBefore) + ' → ' + pct(x.olaNow) + '</td><td class="n c-drr">' + units(x.drrBefore) + ' → ' + units(x.drrNow) + '</td><td class="n">' + inr(x.value) + '</td>';
      }, sorted, 'cities');
      if (po) {
        var shortUnits = a.combos.reduce(function (sum, x) { return sum + cityOrder(x); }, 0);
        out += '<p class="natline">Of the ' + qty(total) + ' units, ' + qty(shortUnits) + ' go to the ' + num(n) + (n > 1 ? ' short cities' : ' short city') + ' and ' +
          qty(Math.max(0, total - shortUnits)) + ' to the cities that aren’t short.</p>';
      }
    }
    return out + '<p class="how"><b>How the ₹ is worked out.</b> ' + esc(howValue(a)) + '</p>';
  }

  // ---------- one-line action rows ----------
  function ageText(a) {
    if (a.age <= 2) return '<span class="tag new">New</span>';
    if (a.age >= 8) return '<span class="tag stale"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5 15 14H1z"></path><path class="ex" d="M8 6v3.6M8 11.4v.1"></path></svg>' + a.age + 'd open</span>';
    return '<span class="tag plain-muted">' + a.age + 'd</span>';
  }
  function actionRow(a, i, opt) {
    var t = TYPES[a.type], k = content(a), open = !!state.openAct[a.id];
    var money = inr(a.value) + '<small>/mo</small>';
    var where = a.plat || 'All platforms';
    return '<li class="arow' + (open ? ' open' : '') + '" data-id="' + a.id + '" data-anchor="act-' + a.id + '">' +
      '<button type="button" class="arow-main" data-act="toggle" aria-expanded="' + open + '" title="' + esc(k.title) + '">' +
      '<span class="rank">' + (i + 1) + '</span><span class="dot ' + t[1] + '" aria-hidden="true"></span>' +
      '<span class="arow-title">' + esc(k.title) + '</span>' +
      '<span class="arow-tags"><span class="tag plain">' + esc(where) + '</span>' +
      (opt.showOwner ? '<span class="tag plain">' + esc(ownerLabel(a.owner)) + '</span>' : '') + ageText(a) + '</span>' +
      '<span class="arow-money">' + money + '</span><span class="chev" aria-hidden="true"></span></button>' +
      (open ? '<div class="arow-detail' + (state.justOpened === a.id ? ' enter' : '') + '">' +
        '<p class="kind"><span class="dot ' + t[1] + '" aria-hidden="true"></span>' + t[0] + ' · ' + esc(ownerLabel(a.owner)) + '</p>' +
        '<p class="why">' + esc(k.why) + '</p><p class="ask"><span>Next step</span> ' + esc(k.ask) + '</p>' + evidence(a) +
        (opt.readOnly ? '' : '<div class="row-btns"><button type="button" class="btn primary" data-act="done">Mark done</button>' +
          '<button type="button" class="btn ghost" data-act="snooze">Snooze 7 days</button></div>') +
        '</div>' : '') + '</li>';
  }

  // ---------- filters (one row, scopes everything on the page) ----------
  // qola / qdrr are not filters: they set the quadrant lines in Explore (lead, 2026-10-05), defaulting to RULES.
  function scopeOf(owner) {
    var p = owner.split('|'), f = { plat: '', cat: '', city: '', q: '', type: '', role: '',
      qola: String(Math.round(R.quadOla * 100)), qdrr: String(Math.round(R.quadDrr * 100)) };
    if (p[0] === 'KAE') { f.plat = p[1]; f.cat = p[2]; }
    if (p[0] === 'KAM') f.plat = p[1];
    if (p[0] === 'PERF' || p[0] === 'CSP') f.cat = p[1];
    return f;
  }
  function comboOk(c) {
    var f = state.f;
    if (f.plat && c.plat !== f.plat) return false;
    if (f.cat && c.cat !== f.cat) return false;
    if (f.city && c.city !== f.city) return false;
    if (f.q) {
      if (c.sku == null) return false;   // off-platform media is for a whole segment, not one base pack
      var s = Q.SKU[c.sku];
      if ((s.name + ' ' + s.code).toLowerCase().indexOf(f.q.trim().toLowerCase()) < 0) return false;
    }
    return true;
  }
  function actionOk(a) {
    var f = state.f;
    if (f.type && TYPES[a.type][0] !== f.type) return false;
    if (f.role && roleOf(a.owner) !== f.role) return false;
    return a.combos.some(comboOk);
  }
  function isOpen(a) { return !state.done[a.id] && !state.snoozed[a.id]; }

  function filterBar(v, typesHere) {
    var f = state.f, scope = scopeOf(v.owner);
    function sel(id, label, val, opts) {
      return '<label class="f" for="' + id + '"><span>' + label + '</span><select id="' + id + '"><option value="">All</option>' +
        opts.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (o[0] === val ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') +
        '</select></label>';
    }
    var changed = ['plat', 'cat', 'city', 'q', 'type', 'role'].some(function (k) { return (f[k] || '') !== (scope[k] || ''); });
    return '<div class="filters" data-anchor="filters" role="search">' +
      sel('f-plat', 'Platform', f.plat, Q.PLATFORMS.map(function (p) { return [p, p]; })) +
      sel('f-cat', 'Category', f.cat, Q.CATS.map(function (c) { return [c.id, c.name]; })) +
      '<label class="f f-city" for="f-city"><span>City (' + Q.CITY_NAMES.length + ')</span><input id="f-city" type="search" list="city-list" placeholder="All cities" value="' + esc(f.city) + '" autocomplete="off"></label>' +
      '<label class="f f-q" for="f-q"><span>Base pack (' + num(Q.SKU.length) + ')</span><input id="f-q" type="search" placeholder="Name or code" value="' + esc(f.q) + '" autocomplete="off"></label>' +
      (typesHere.length > 1 ? sel('f-type', 'Action type', f.type, typesHere.map(function (t) { return [t, t]; })) : '') +
      (v.kind === 'master' ? sel('f-role', 'Owner', f.role, Object.keys(ROLES).map(function (r) { return [r, ROLES[r]]; })) : '') +
      (changed ? '<button type="button" class="btn ghost" data-act="f-reset">' + (v.kind === 'master' ? 'Clear filters' : 'Back to my area') + '</button>' : '') +
      '</div>';
  }

  // ---------- page pieces ----------
  function crumb() {
    if (!state.stack.length) return '';
    var label = state.stack.length > 1 ? state.stack[state.stack.length - 2].title : PERSONAS.filter(function (x) { return x.id === state.persona; })[0].title;
    return '<button type="button" class="back" data-act="back">‹ Back to ' + esc(label) + '</button>';
  }
  function stakeOf(list) { return list.reduce(function (s, a) { return s + a.value; }, 0); }
  function doneCount(owner) {
    return Q.doneThisWeek(owner) + Q.ACTIONS.filter(function (a) { return a.owner === owner && state.done[a.id]; }).length;
  }
  function stat(n, label) { return '<div><b>' + n + '</b><span>' + label + '</span></div>'; }
  function leverOf(a) { return TYPES[a.type][2]; }

  function groupOf(a) { return TYPES[a.type][3]; }

  // One section per lever, in funnel order; inside it, one short list per action type, biggest first,
  // 5 rows to start and 10 more per "See more". `groups` = the action types this view can have.
  function leverSections(list, opt, groups) {
    return LEVERS.filter(function (L) { return GROUPS.some(function (g) { return g.lever === L.id && groups.indexOf(g.id) >= 0; }); }).map(function (L) {
      var inLever = list.filter(function (a) { return leverOf(a) === L.id; });
      var head = '<h3 class="lever"><span class="dot ' + L.dot + '" aria-hidden="true"></span>' + L.name + ' <span>' + L.q +
        (inLever.length ? ' · ' + inr(stakeOf(inLever)) + '/mo opportunity' : ' · nothing with these filters') + '</span></h3>';
      var body = GROUPS.filter(function (g) { return g.lever === L.id && groups.indexOf(g.id) >= 0; }).map(function (g) {
        var items = inLever.filter(function (a) { return groupOf(a) === g.id; }), shown = items.slice(0, state.actLimit[g.id]);
        var gh = '<h4 class="grp">' + g.name + ' <span>' + (g.who ? g.who + ' · ' : '') +   // who acts, where it could be unclear
          (items.length ? num(items.length) + ' · ' + inr(stakeOf(items)) + '/mo' : 'none with these filters') + '</span></h4>';
        if (!items.length) return '<div class="grp-sec">' + gh + '</div>';
        return '<div class="grp-sec">' + gh + '<ol class="arows">' + shown.map(function (a, i) { return actionRow(a, i, opt); }).join('') + '</ol>' +
          (items.length > shown.length ? '<div class="more-row"><button type="button" class="btn more" data-act="act-more" data-group="' + g.id + '" data-anchor="act-more-' + g.id + '">See ' +
            Math.min(ACT_PAGE, items.length - shown.length) + ' more</button><span class="count-note">Showing ' + shown.length + ' of ' + num(items.length) + '</span></div>' : '') + '</div>';
      }).join('');
      return '<section class="lever-sec">' + head + body + '</section>';
    }).join('');
  }
  function groupsIn(list) { return GROUPS.filter(function (g) { return list.some(function (a) { return groupOf(a) === g.id; }); }).map(function (g) { return g.id; }); }

  function teamRows(v) {
    if (v.owner.indexOf('KAM|') === 0) {
      var plat = v.owner.split('|')[1];
      return Q.CATS.map(function (c) { return { label: 'KAE · ' + c.name, view: { kind: 'exec', owner: 'KAE|' + plat + '|' + c.id, title: plat + ' · ' + c.name, sub: 'Key Account Executive' }, owners: ['KAE|' + plat + '|' + c.id] }; });
    }
    if (v.owner === 'NAM') {
      return Q.PLATFORMS.map(function (p) {
        return { label: 'KAM · ' + p + ' and team', view: { kind: 'manager', owner: 'KAM|' + p, title: p, sub: 'Key Account Manager' },
          owners: ['KAM|' + p].concat(Q.CATS.map(function (c) { return 'KAE|' + p + '|' + c.id; })), done: Q.doneThisWeek('KAM|' + p) + 4 };
      });
    }
    return Q.CATS.map(function (c) { return { label: 'CSP · ' + c.name, view: { kind: 'exec', owner: 'CSP|' + c.id, title: c.name + ' · all platforms', sub: 'CSP executive' }, owners: ['CSP|' + c.id] }; });
  }
  function teamTable(rows) {
    rows.forEach(function (r) { r.acts = Q.ACTIONS.filter(function (a) { return r.owners.indexOf(a.owner) >= 0 && isOpen(a) && actionOk(a); }); });
    rows.sort(function (a, b) { return stakeOf(b.acts) - stakeOf(a.acts); });
    state.rows = rows;
    return '<div class="tbl-wrap"><table class="team"><thead><tr><th>Person</th><th class="n">Open</th><th class="n">Opportunity ₹/mo</th><th class="n">Done this week</th><th class="n">Oldest open</th><th><span class="vh">Open list</span></th></tr></thead><tbody>' +
      rows.map(function (r, i) {
        var oldest = r.acts.reduce(function (m, a) { return Math.max(m, a.age); }, 0);
        return '<tr data-act="drill" data-row="' + i + '" data-anchor="team-' + i + '" tabindex="0"><td>' + esc(r.label) + '</td><td class="n">' + r.acts.length + '</td>' +
          '<td class="n">' + (r.acts.length ? inr(stakeOf(r.acts)) : '–') + '</td><td class="n">' + (r.done != null ? r.done : doneCount(r.view.owner)) + '</td>' +
          '<td class="n">' + (r.acts.length ? (oldest >= 8 ? '<span class="late">' + oldest + ' days</span>' : oldest + ' days') : '–') + '</td>' +
          '<td class="go">View list ›</td></tr>';
      }).join('') + '</tbody></table></div>';
  }
  // Top-level summary: total offtake and average OLA for the area (simple sums and averages).
  function pulse(t) {
    var d = t.before ? t.now / t.before - 1 : 0, o = t.ola - t.olaB;
    return stat(inr(t.now) + ' <small class="' + (d < 0 ? 'neg' : 'pos') + '">' + (d < 0 ? '−' : '+') + Math.abs(Math.round(d * 1000) / 10) + '%</small>', 'offtake a month, vs Apr–Jun') +
      stat(pct(t.ola) + ' <small class="' + (o < 0 ? 'neg' : 'pos') + '">' + (o < 0 ? '−' : '+') + Math.abs(Math.round(o * 100)) + ' pts</small>', 'OLA across all dark stores');
  }
  var SHORT_ROLE = { 'Key Account Manager': 'KAM', 'National Account Manager': 'NAM', 'CSP lead': 'CSP lead' };

  // ---------- page ----------
  function current() {
    if (state.stack.length) return state.stack[state.stack.length - 1];
    var p = PERSONAS.filter(function (x) { return x.id === state.persona; })[0];
    return { kind: p.kind, owner: p.owner, title: p.title, sub: p.sub };
  }

  function leafDetail(c, t) {
    var s = Q.SKU[c.sku], acts = c.actions || [], quad = Q.QUADS[quadOf(c.i, t)];
    return '<div class="leaf"><p class="leaf-title">' + esc(s.name + ' · ' + c.city + ' · ' + c.plat) + ' <span class="qchip">' + icon(quad) + QUADS[quad].name + '</span></p>' +
      h.trends(c) + h.metrics(c, c.drivers) +
      (acts.length
        ? '<ul class="leaf-acts">' + acts.map(function (a) {
            var t = h.TYPES[a.type];
            return '<li><span class="dot ' + t[1] + '" aria-hidden="true"></span>' + esc(h.content(a).title) +
              ' <span class="sub">' + esc(h.ownerLabel(a.owner)) + ' · ' + inr(a.value) + ' a month</span></li>';
          }).join('') + '</ul>'
        : '<p class="noact">' + esc(reason(c, quad)) + '</p>') +
      '<p class="meta-line">Base pack ' + s.code + ' · ' + s.seg + ' · Jul–Sep compared with Apr–Jun</p></div>';
  }

  function rows(c, path, lv) {
    var depth = path.length, dim = lv[depth], leaf = depth === lv.length - 1, out = '', s = sortState();
    var parent = path.map(function (p) { return '/' + p.dim + ':' + p.val; }).join('');
    var limit = ex.limits[parent] || PAGE, enter = ex.justOpened === parent ? ' enter' : '';
    if (leaf) {
      var list = depth === 0 ? [] : under(path, c);
      if (depth === 0) {   // every level pinned: rows are base packs, one combination each
        var qi = ex.quad ? Q.QI[ex.quad] : -1;
        for (var i = 0; i < N; i++) if (pass(i, c.P) && (qi < 0 || quadOf(i, c.t) === qi)) list.push(i);
      }
      var items = list.map(function (i) { return fromList([i], i, c.t); });
      items.sort(function (a, b) { return s.dir * (gval(a, s.key) - gval(b, s.key)); });
      items.slice(0, limit).forEach(function (a) {
        var i = a.key, key = 'leaf:' + i, open = !!ex.open[key], cmb = A.act[i] || open ? Q.combo(i) : null;
        var act = cmb && cmb.actions ? cmb.actions.map(function (x) { return SHORT[x.type]; }).join(', ') : '–';
        out += '<tr class="row leaf-tr d' + depth + enter + (open ? ' is-open' : '') + '" data-act="ex-node" data-node="' + key + '" data-anchor="' + key + '" tabindex="0" aria-expanded="' + open + '">' +
          '<td class="name" style="--d:' + depth + '"><span class="chev" aria-hidden="true"></span>' + esc(dimLabel(dim, dim === 'sku' ? A.sku[i] : dim === 'city' ? A.city[i] : A.plat[i])) + '</td>' +
          '<td>' + (ex.quad ? '' : '<span class="qchip">' + icon(Q.QUADS[quadOf(i, c.t)]) + QUADS[Q.QUADS[quadOf(i, c.t)]].name + '</span>') + '</td>' +
          cells(a) + '<td class="act">' + esc(act) + '</td></tr>' +
          (open ? '<tr class="detail-tr' + (ex.justOpened === key ? ' enter' : '') + '"><td colspan="' + COLS + '" style="--d:' + depth + '">' + leafDetail(cmb, c.t) + '</td></tr>' : '');
      });
      return out + moreRow(parent, Math.min(limit, items.length), items.length, depth, dim);
    }
    var groups;
    if (depth === 0) {
      var slot = ex.quad ? Q.QI[ex.quad] : 4;
      groups = [];
      for (var k = 0; k < NS; k++) if (c.n[k * 5 + slot]) groups.push(fromSlot(c, k, slot));
      groups.forEach(function (g) { g.ola = g.ola; });
    } else {
      var byKey = {};
      under(path, c).forEach(function (i) { var kk = dim === 'city' ? A.city[i] : A.plat[i]; (byKey[kk] = byKey[kk] || []).push(i); });
      groups = Object.keys(byKey).map(function (kk) { return fromList(byKey[kk], +kk, c.t); });
    }
    groups.sort(function (a, b) { return s.dir * (gval(a, s.key) - gval(b, s.key)); });
    groups.slice(0, limit).forEach(function (a) {
      var key = parent + '/' + dim + ':' + a.key, open = !!ex.open[key];
      out += '<tr class="row grp d' + depth + enter + (open ? ' is-open' : '') + '" data-act="ex-node" data-node="' + esc(key) + '" data-anchor="' + esc(key) + '" tabindex="0" aria-expanded="' + open + '">' +
        '<td class="name" style="--d:' + depth + '"><span class="chev" aria-hidden="true"></span>' + esc(dimLabel(dim, a.key)) +
        ' <span class="sub">' + num(a.n) + (a.n === 1 ? ' combination' : ' combinations') + '</span></td>' +
        '<td>' + (ex.quad ? '' : mix(a.q)) + '</td>' + cells(a) + '<td class="n">' + (a.acts || '–') + '</td></tr>';
      if (open) out += rows(c, path.concat([{ dim: dim, val: a.key }]), lv);
    });
    return out + moreRow(parent, Math.min(limit, groups.length), groups.length, depth, dim);
  }

  function table(c) {
    var lv = levels(), qi = ex.quad ? Q.QI[ex.quad] : -1, count = qi >= 0 ? c.q[qi] : c.total;
    if (!count) return '<div class="empty">Nothing here. Try another quadrant or widen the filters.</div>';
    var anyOpen = Object.keys(ex.open).some(function (k) { return ex.open[k]; });
    return '<div class="tree-bar"><p class="hint">Open a row to see what is under it: ' + lv.map(function (d) { return PLURAL[d]; }).join(' › ') +
      '. Click it again to close it. Lists load 15 at a time.</p>' +
      (anyOpen ? '<button type="button" class="btn ghost" data-act="ex-collapse" data-anchor="tree-bar">Close all</button>' : '') + '</div>' +
      '<div class="tbl-wrap"><table class="grid tree"><thead><tr><th>' + lv.map(function (d) { return DIMS[d]; }).join(' › ') + '</th>' +
      '<th>' + (ex.quad ? '' : 'Quadrants') + '</th>' + th('OLA', 'ola', 'n') + th('DRR', 'drr', 'n') + th('Offtake/mo', 'delta', 'n') +
      th('Actions', 'acts', 'n') +
      '</tr></thead><tbody>' + rows(c, [], lv) + '</tbody></table></div>';
  }

  // The two quadrant lines, set right above the quadrants they draw.
  function cutRow(t) {
    function sel(id, label, val, unit) {
      return '<label class="f" for="' + id + '"><span>' + label + '</span><select id="' + id + '">' + CUTS.map(function (v) {
        return '<option value="' + v + '"' + (+v === Math.round(val * 100) ? ' selected' : '') + '>' + v + unit(v) + '</option>';
      }).join('') + '</select></label>';
    }
    return '<div class="cuts" data-anchor="quad-cuts">' +
      sel('f-qola', 'OLA counts as falling when down', t.ola, function (v) { return v === '1' ? ' pt or more' : ' pts or more'; }) +
      sel('f-qdrr', 'DRR counts as falling when down', t.drr, function () { return '% or more'; }) +
      '<p class="hint">A smaller change either way counts as stable, together with rising.</p></div>';
  }

  // ---------- section ----------
  function html(v) {
    if (ex.owner !== v.owner) reset(v.owner);
    var c = compute(UI.state.f), qi = ex.quad ? Q.QI[ex.quad] : -1;
    var out = '<section class="explore" id="explore" aria-labelledby="ex-h">' +
      '<h2 class="sec" id="ex-h">Explore <span>every base pack × city × platform in the filters above. Click a quadrant to focus on it.</span></h2>' +
      cutRow(c.t) + tiles(c) +
      (ex.quad ? '<p class="focus" data-anchor="focus">' + icon(ex.quad) + 'Showing <b>' + QUADS[ex.quad].name + '</b> only · ' + num(c.q[qi]) + ' combinations ' +
        '<button type="button" class="link-btn" data-act="ex-quad" data-quad="' + ex.quad + '">Show all quadrants</button></p>' : '') +
      table(c) + '</section>';
    ex.justOpened = null;
    return out;
  }

  return {
    html: html, state: ex, stats: stats, totals: totals,
    toggleQuad: function (k) { ex.quad = ex.quad === k ? '' : k; ex.open = {}; ex.limits = {}; },
    toggleNode: function (key) { ex.open[key] = !ex.open[key]; ex.justOpened = ex.open[key] ? key : null; },
    more: function (parent) { ex.limits[parent] = (ex.limits[parent] || PAGE) + PAGE; },
    sort: function (key) {
      var s = sortState();
      ex.sort = { key: key, dir: s.key === key ? -s.dir : (key === 'delta' || key === 'ola' || key === 'drr' || key === 'sp' || key === 'cat' ? 1 : -1) };
    },
    collapse: function () { ex.open = {}; },
    filtersChanged: function () { ex.open = {}; ex.limits = {}; }
  };
})(QC, UI);
if (typeof module !== 'undefined' && module.exports) module.exports = EX;

</script>
<script>
/* QC Action Desk prototype: page wiring. Depends on engine.js, ui.js and explore.js. */
(function () {
  'use strict';
  var S = UI.state, root = document.getElementById('view'), sel = document.getElementById('persona');
  var KEY = 'qc-persona-v2';

  try {
    var saved = localStorage.getItem(KEY);
    if (saved && UI.PERSONAS.some(function (p) { return p.id === saved; })) S.persona = saved;
  } catch (e) { /* storage blocked: start on the master view */ }

  sel.innerHTML = UI.PERSONAS.map(function (p) {
    return '<option value="' + p.id + '">' + p.sub + (p.kind === 'master' ? '' : ' · ' + p.title) + '</option>';
  }).join('');
  sel.value = S.persona;
  sel.addEventListener('change', function () {
    S.persona = sel.value; S.stack = [];
    try { localStorage.setItem(KEY, S.persona); } catch (e) { /* ignore */ }
    render(); window.scrollTo(0, 0);
  });

  // Re-render without the page jumping: keep the clicked element where it was on screen.
  function render(anchorEl) {
    var key = anchorEl && anchorEl.getAttribute('data-anchor');
    var top = anchorEl ? anchorEl.getBoundingClientRect().top : 0;
    root.innerHTML = UI.viewHTML();
    if (!key) return;
    var el = root.querySelector('[data-anchor="' + key.replace(/["\\]/g, '\\$&') + '"]');
    if (el) window.scrollBy(0, el.getBoundingClientRect().top - top);
  }
  function anchorOf(t) { return t.closest('[data-anchor]'); }

  root.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (!t) return;
    var act = t.getAttribute('data-act'), row = t.closest('.arow'), id = row && row.getAttribute('data-id');
    var anchor = anchorOf(t);
    switch (act) {
      case 'toggle': UI.toggleAct(id); render(anchor); break;
      case 'done': case 'snooze':
        (act === 'done' ? S.done : S.snoozed)[id] = true;
        render(anchor);
        toast(act === 'done' ? 'Marked done.' : 'Snoozed for 7 days.', id, act);
        break;
      case 'act-more': UI.moreActs(t.getAttribute('data-group')); render(anchor); break;
      case 'f-reset': UI.resetFilters(); render(root.querySelector('[data-anchor="filters"]')); break;
      case 'drill':
        var r = S.rows[+t.getAttribute('data-row')], v = { readOnly: true, scrollY: window.scrollY };
        for (var k in r.view) v[k] = r.view[k];
        S.stack.push(v); render(); window.scrollTo(0, 0);
        break;
      case 'back':
        var y = S.stack.pop().scrollY || 0;
        render(); window.scrollTo(0, y);
        break;
      case 'copy': openCopy(); break;
      case 'ex-quad': EX.toggleQuad(t.getAttribute('data-quad')); render(anchor && anchor.matches('.quad') ? anchor : root.querySelector('.quads')); break;
      case 'ex-node': EX.toggleNode(t.getAttribute('data-node')); render(anchor); break;
      case 'ex-more': EX.more(t.getAttribute('data-parent')); render(anchor); break;
      case 'ex-sort': EX.sort(t.getAttribute('data-key')); render(anchor); break;
      case 'ex-collapse': EX.collapse(); render(anchor); break;
    }
    if (act === 'toggle' || act === 'ex-node') {
      var again = root.querySelector('[data-anchor="' + (anchor && anchor.getAttribute('data-anchor') || '').replace(/["\\]/g, '\\$&') + '"]');
      var focusable = again && (again.matches('[data-act]') ? again : again.querySelector('[data-act="toggle"]'));
      if (focusable) focusable.focus({ preventScroll: true });
    }
  });
  root.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-act]')) { e.preventDefault(); e.target.click(); }
  });

  // filters
  document.getElementById('city-list').innerHTML = QC.CITY_NAMES.map(function (c) { return '<option value="' + c + '"></option>'; }).join('');
  // f-qola / f-qdrr sit above the quadrants in Explore and set the quadrant lines
  var FILTERS = { 'f-plat': 'plat', 'f-cat': 'cat', 'f-type': 'type', 'f-role': 'role', 'f-qola': 'qola', 'f-qdrr': 'qdrr' };
  root.addEventListener('change', function (e) {
    var name = FILTERS[e.target.id];
    if (!name) return;
    var id = e.target.id;
    UI.setFilter(name, e.target.value);
    render(e.target.closest('[data-anchor]') || root.querySelector('[data-anchor="filters"]'));
    var el = document.getElementById(id);
    if (el) el.focus({ preventScroll: true });
  });
  root.addEventListener('input', function (e) {
    var id = e.target.id, val = e.target.value;
    if (id !== 'f-q' && id !== 'f-city') return;
    // the city box filters once the text is a full city name (picked from the list) or is cleared
    if (id === 'f-city' && val && QC.CITY_IDX[val] == null) return;
    var pos = e.target.selectionStart;
    UI.setFilter(id === 'f-q' ? 'q' : 'city', val);
    render(root.querySelector('[data-anchor="filters"]'));
    var el = document.getElementById(id);
    if (el) { el.focus({ preventScroll: true }); try { el.setSelectionRange(pos, pos); } catch (er) { /* ignore */ } }
  });

  // toast with undo
  var toastEl = document.getElementById('toast'), timer;
  function toast(msg, id, act) {
    toastEl.innerHTML = '<span>' + msg + '</span><button type="button" id="undo">Undo</button>';
    toastEl.hidden = false;
    clearTimeout(timer);
    document.getElementById('undo').addEventListener('click', function () {
      delete (act === 'done' ? S.done : S.snoozed)[id];
      toastEl.hidden = true; render();
    });
    timer = setTimeout(function () { toastEl.hidden = true; }, 6000);
  }

  // copy list
  var modal = document.getElementById('copybox'), ta = document.getElementById('copytext'), status = document.getElementById('copystatus');
  function openCopy() { ta.value = UI.copyText(); status.textContent = ''; modal.hidden = false; ta.focus(); ta.select(); }
  function fallback() { ta.focus(); ta.select(); status.textContent = 'The text is selected. Press Ctrl+C (⌘C on Mac) to copy it.'; }
  document.getElementById('copygo').addEventListener('click', function () {
    try {
      navigator.clipboard.writeText(ta.value).then(function () { status.textContent = 'Copied. Paste it into your email or chat.'; }, fallback);
    } catch (e) { fallback(); }
  });
  document.getElementById('copyclose').addEventListener('click', function () { modal.hidden = true; });
  modal.addEventListener('click', function (e) { if (e.target === modal) modal.hidden = true; });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') modal.hidden = true; });

  render();
})();

</script>
